<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-fullscreen">
  <meta name="theme-color" content="#1a1a2e">
  <meta name="description" content="Snake game optimized for iPad">
  <title>Snake</title>
  <link rel="stylesheet" href="css/style.css">
</head>
<body>
  <div id="game-container">
    <canvas id="game-canvas"></canvas>

    <!-- Score HUD -->
    <div id="hud">
      <span id="score-display">0</span>
      <span id="high-score-display">Best: 0</span>
    </div>

    <!-- Start screen -->
    <div id="screen-start" class="overlay">
      <div class="overlay-content">
        <h1 class="game-title">SNAKE</h1>
        <p class="subtitle">Swipe to move</p>
        <button id="btn-start" class="btn-primary">Play</button>
      </div>
    </div>

    <!-- Pause screen -->
    <div id="screen-pause" class="overlay hidden">
      <div class="overlay-content">
        <h2>Paused</h2>
        <button id="btn-resume" class="btn-primary">Resume</button>
        <button id="btn-restart-pause" class="btn-secondary">Restart</button>
      </div>
    </div>

    <!-- Game over screen -->
    <div id="screen-gameover" class="overlay hidden">
      <div class="overlay-content">
        <h2 class="gameover-title">Game Over</h2>
        <p class="final-score-label">Score</p>
        <p id="final-score" class="final-score">0</p>
        <p id="new-high-score" class="new-record hidden">New Record!</p>
        <button id="btn-restart" class="btn-primary">Play Again</button>
      </div>
    </div>

    <!-- Pause button (shown during gameplay) -->
    <button id="btn-pause" class="hidden" aria-label="Pause">&#9646;&#9646;</button>
  </div>

  <script src="js/config.js"></script>
  <script src="js/input.js"></script>
  <script src="js/renderer.js"></script>
  <script src="js/game.js"></script>
  <script src="js/main.js"></script>
</body>
</html>
